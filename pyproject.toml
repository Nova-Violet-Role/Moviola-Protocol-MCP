[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "moviola-protocol-mcp"
version = "0.3.1"
description = "MCP server and CLI converting video and images through the Moviola Protocol grey presets, with an always-seeable SQLite index of every conversion."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "AGPL-3.0-or-later OR EUPL-1.2" }
authors = [{ name = "Saimonokuma" }]
keywords = ["mcp", "ffmpeg", "gif", "video", "greyscale", "moviola", "model-context-protocol"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Video :: Conversion",
]
dependencies = ["mcp>=1.2,<2"]

[project.optional-dependencies]
torch = ["torch>=2.0"]
jax = ["jax"]
maxtext = ["jax", "array-record"]
unsloth = ["unsloth"]

[project.urls]
Homepage = "https://github.com/Nova-Violet-Role/Moviola-Protocol-MCP"
Repository = "https://github.com/Nova-Violet-Role/Moviola-Protocol-MCP"

[project.scripts]
moviola-protocol-mcp = "moviola_protocol_mcp.server:main"
moviola = "moviola_protocol_mcp.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[tool.hatch.build]
exclude = ["/APPDATA", "/.pytest_cache", "/.ruff_cache"]

[tool.hatch.build.targets.wheel]
packages = ["src/moviola_protocol_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
